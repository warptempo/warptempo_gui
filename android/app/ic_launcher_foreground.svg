<!-- The launcher's foreground: the flagged quaver of Breeze's music-note-16th
     (assets/icons/breeze/music-note-16th.svg, the 22 px action icon the BPM
     button wears, transcribed for the roster as Icon::MusicNote16th) with its
     head and flag FILLED. As Breeze draws it the glyph is an outline: its one
     path's second and third subpaths (from "m 1,1.0957031" and from
     "M 9,15") cut the flag and the head hollow. Both are dropped here, so
     the head and the flag are solid, the style of the original icon's note,
     his pick between two mock-ups (architect 2026-09-30). Nothing else
     changes: d is the vendored file's d truncated before its second subpath,
     the outer contour byte for byte through its own closing Z, so it is a
     verbatim prefix of the vendored d (grep -F of this d followed by
     " m 1,1.0957031" against the vendored file finds it) and a diff between
     the two is a transcription bug. The ink and opacity are the note's of
     Breeze's audio-x-generic (assets/icons/breeze/audio-x-generic.svg): its
     group's fill #fff and its path's opacity .75, white over the sheet grey,
     in place of the vendored file's ColorScheme-Text. The desktop twin,
     packaging/warptempo_gui.svg (the .desktop's Icon=), carries this same d
     on its drawn plate, so a change to one is a change to both. The vendored path carries no transform, so d is in the
     22-unit frame's own coordinates. The viewBox is the filled glyph's own
     bounding box there, measured by rendering the path alone and trimming
     it (x 6..16, y 3..19: 10 by 16 units), so this file renders the glyph
     edge to edge. It lives beside the manifest, outside res/, which aapt2
     compiles whole; the PNG layers are rendered from it once by the recipe
     in res/mipmap-anydpi-v26/ic_launcher.xml. -->
<svg version="1.1" viewBox="6 3 10 16" xmlns="http://www.w3.org/2000/svg">
    <path d="m 11,3 0,1 0,3 0,1 0,4 0,2.640625 C 10.450691,14.229206 9.7385673,14.001104 9,14 7.3431458,14 6,15.119288 6,16.5 6,17.880712 7.3431458,19 9,19 c 1.656854,0 3,-1.119288 3,-2.5 L 12,12 12,8.0957031 c 1.473938,0.2519592 3.180894,1.3814645 4,2.1485529 L 16,9.5 16,9 16,8.84375 16,5.5 16,4.84375 C 14.788541,3.8472864 12.971189,3 11,3 Z" fill="#fff" opacity=".75"/>
</svg>
