<!-- The launcher's foreground: the notes on a staff of Breeze's minuet-scales
     (assets/icons/breeze/minuet-scales.svg, the 22 px action icon, vendored
     verbatim), the glyph the Marker Measure button wore until 2026-09-16. Its
     path d is copied byte for byte from that file, exponent spellings
     included, so a diff between the two d strings is a transcription bug. Its
     fill is the file's ColorScheme-Text colour, #232629, resolved here (the
     file paints currentColor through that class). The file's group
     translate(0 -1030.4) and path translate(0,1030.4) cancel exactly, so
     both are dropped and d is in the 22-unit frame's own coordinates (the
     two render identically). The viewBox is the glyph's own bounding box
     there, measured by rendering the path alone and trimming it (x 3..19,
     y 3..19.409: 16 by 16.409 units), so this file renders the glyph edge to
     edge. It lives beside the manifest, outside res/, which aapt2 compiles
     whole; the PNG layers are rendered from it once by the recipe in
     res/mipmap-anydpi-v26/ic_launcher.xml. -->
