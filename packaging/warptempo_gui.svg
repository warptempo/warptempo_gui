<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- The program icon outside the window, the Linux desktop icon (the .desktop's
       Icon=warptempo_gui): the speedometer, the caption's icon and the glyph
       Warp wears, the icon set's one own file (assets/icons/adwaita-3.22/README.md),
       bare on transparency (architect 2026-10-12; the speedometer since 2026-10-17). GENERATED
       by tools/app_icon/gen_app_icon.sh from assets/icons/adwaita-3.22/AppIcon.svg,
       the drawing verbatim: regenerate, never hand-edit. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Speedometer and AppIcon: NOT from adwaita-icon-theme 3.22.0. Warp's glyph and the program icon, a speedometer (architect 2026-10-17 evening, "c1. ok to implement and install"): drawn with Google's Gemini at his prompt against a style sheet of Lapo Calamandrei's glossy Adwaita 3.22 drawings, the second of four drawings, in the 48-unit frame with no nested viewport. Cleaned the same evening: its three numerals (0, 120, 240) deleted with their empty group (the product's resvg draws no text), its ground-shadow ellipse deleted with its unused gradient; its chrome gradients (the outer bezel, its border, the inner bevel ring, the hub rim and the hub cap) re-tinted from Tango aluminium (hue 60 to 90, saturation 3 to 9 %) to hue 210 at saturation 6 %, every stop's HLS lightness kept (variant C1); every other element as drawn, the needle's and the hub's dark copies on the face among them. The drawing: centre (24, 23), a chrome bezel r 20.5 with a .8 stroke round a dark face r 16.2 under a glass gloss; nine white majors and ten minors on a 270 degree arc from -135 to +135 degrees, its last 45 degrees a red gradient arc with a glow; a tapered red needle at +52 degrees from twelve o'clock with a bright ridge line; a chrome hub cap. The drawing is licensed under the GNU LGPL v3, the set's licence (architect 2026-10-15). Warp, and the program icon. -->
  <defs>
    <!-- Outer Bezel Metallic Gradient -->
    <linearGradient id="outerBezel" x1="24" y1="2" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f8f8" />
      <stop offset="18%" stop-color="#d0d3d6" />
      <stop offset="55%" stop-color="#80888f" />
      <stop offset="85%" stop-color="#50555a" />
      <stop offset="100%" stop-color="#393c40" />
    </linearGradient>

    <!-- Outer Bezel Rim Contour -->
    <linearGradient id="bezelBorder" x1="24" y1="2" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b5babe" />
      <stop offset="100%" stop-color="#2f3235" />
    </linearGradient>

    <!-- Inner Bevel Highlight Ring -->
    <linearGradient id="innerBevel" x1="24" y1="5.5" x2="24" y2="40.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#212325" />
      <stop offset="45%" stop-color="#50555a" />
      <stop offset="90%" stop-color="#ecedee" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Dark Charcoal Dial Face -->
    <radialGradient id="dialFace" cx="21" cy="16" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a454f" />
      <stop offset="55%" stop-color="#1c2228" />
      <stop offset="100%" stop-color="#0c0f12" />
    </radialGradient>

    <!-- Glass Gloss Reflection -->
    <linearGradient id="glassGloss" x1="20" y1="6" x2="24" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Redzone Ambient Glow -->
    <radialGradient id="redzoneGlow" cx="35.5" cy="28.5" r="7.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3b14" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff3b14" stop-opacity="0" />
    </radialGradient>

    <!-- Redzone Arc Gradient -->
    <linearGradient id="redzoneGrad" x1="38" y1="23" x2="33" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7a2e" />
      <stop offset="50%" stop-color="#f53d1e" />
      <stop offset="100%" stop-color="#cc1414" />
    </linearGradient>

    <!-- Needle Gradient -->
    <linearGradient id="needleGrad" x1="22.8" y1="16" x2="25.2" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff644c" />
      <stop offset="45%" stop-color="#ed2929" />
      <stop offset="100%" stop-color="#a80f0f" />
    </linearGradient>

    <!-- Center Metallic Hub Cap -->
    <radialGradient id="hubCap" cx="22.8" cy="21.8" r="3.6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#d0d3d6" />
      <stop offset="75%" stop-color="#737a81" />
      <stop offset="100%" stop-color="#3c4043" />
    </radialGradient>

    <linearGradient id="hubRim" x1="24" y1="19.5" x2="24" y2="26.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d0d3d6" />
      <stop offset="100%" stop-color="#2f3235" />
    </linearGradient>

    <!-- Clip Path for Dial Face -->
    <clipPath id="dialClip">
      <circle cx="24" cy="23" r="16.2" />
    </clipPath>
  </defs>

  <!-- Outer Metallic Bezel -->
  <circle cx="24" cy="23" r="20.5" fill="url(#outerBezel)" stroke="url(#bezelBorder)" stroke-width="0.8" />

  <!-- Subtle Outer Rim Specular Highlight -->
  <circle cx="24" cy="23" r="19.7" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.5" />

  <!-- Inner Bevel Ring -->
  <circle cx="24" cy="23" r="17.8" fill="url(#innerBevel)" />

  <!-- Dark Recessed Inner Frame -->
  <circle cx="24" cy="23" r="16.9" fill="#101316" />

  <!-- Main Dark Dial Face -->
  <circle cx="24" cy="23" r="16.2" fill="url(#dialFace)" />

  <!-- Dial Internal Contents -->
  <g clip-path="url(#dialClip)">
    <!-- Redzone Glow -->
    <circle cx="35.5" cy="28.5" r="7.5" fill="url(#redzoneGlow)" />

    <!-- Upper Glass Reflection -->
    <path d="M 6 26.5 Q 21 16.5 41 20.5 L 41 5 L 6 5 Z" fill="url(#glassGloss)" />
  </g>

  <!-- White Scale Outer Arc (-135 deg to +90 deg) -->
  <path d="M 13.96 33.04 A 14.2 14.2 0 1 1 38.2 23" fill="none" stroke="#dce1e5" stroke-width="1.15" stroke-linecap="butt" />

  <!-- Redzone Scale Outer Arc (+90 deg to +135 deg) -->
  <path d="M 38.2 23 A 14.2 14.2 0 0 1 34.04 33.04" fill="none" stroke="url(#redzoneGrad)" stroke-width="1.25" stroke-linecap="square" />

  <!-- Minor Ticks (White) -->
  <g stroke="#cad1d6" stroke-width="0.65" stroke-linecap="butt">
    <line x1="24" y1="8.8" x2="24" y2="10.5" transform="rotate(-123.75 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="10.5" transform="rotate(-101.25 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="10.5" transform="rotate(-78.75 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="10.5" transform="rotate(-56.25 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="10.5" transform="rotate(-33.75 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="10.5" transform="rotate(-11.25 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="10.5" transform="rotate(11.25 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="10.5" transform="rotate(33.75 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="10.5" transform="rotate(56.25 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="10.5" transform="rotate(78.75 24 23)" />
  </g>

  <!-- Major Ticks (White) -->
  <g stroke="#e6ebef" stroke-width="1.2" stroke-linecap="butt">
    <line x1="24" y1="8.8" x2="24" y2="11.5" transform="rotate(-135 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="11.5" transform="rotate(-112.5 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="11.5" transform="rotate(-90 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="11.5" transform="rotate(-67.5 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="11.5" transform="rotate(-45 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="11.5" transform="rotate(-22.5 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="11.7" transform="rotate(0 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="11.5" transform="rotate(22.5 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="11.5" transform="rotate(45 24 23)" />
    <line x1="24" y1="8.8" x2="24" y2="11.5" transform="rotate(67.5 24 23)" />
  </g>

  <!-- Redzone Minor & Major Ticks -->
  <g stroke="url(#redzoneGrad)" stroke-linecap="butt">
    <line x1="24" y1="8.7" x2="24" y2="11.6" stroke-width="1.25" transform="rotate(90 24 23)" />
    <line x1="24" y1="8.7" x2="24" y2="10.5" stroke-width="0.7" transform="rotate(101.25 24 23)" />
    <line x1="24" y1="8.7" x2="24" y2="11.4" stroke-width="1.15" transform="rotate(112.5 24 23)" />
    <line x1="24" y1="8.7" x2="24" y2="10.5" stroke-width="0.7" transform="rotate(123.75 24 23)" />
    <line x1="24" y1="8.7" x2="24" y2="11.6" stroke-width="1.25" transform="rotate(135 24 23)" />
  </g>

  <!-- Speedometer Needle (Rotated +52 deg) -->
  <g transform="rotate(52 24 23)">
    <!-- Needle Drop Shadow -->
    <path d="M 22.8 23 L 23.65 10.2 A 0.45 0.45 0 0 1 24.55 10.2 L 25.4 23 Z" fill="#000000" fill-opacity="0.45" transform="translate(0.4, 0.5)" />
    <!-- Needle Body -->
    <path d="M 22.7 23 L 23.6 10.1 A 0.4 0.4 0 0 1 24.4 10.1 L 25.3 23 Z" fill="url(#needleGrad)" />
    <!-- Needle Center Ridge Highlight -->
    <line x1="23.85" y1="21" x2="23.95" y2="10.6" stroke="#ff9580" stroke-width="0.35" stroke-linecap="round" />
  </g>

  <!-- Center Metallic Hub Cap -->
  <circle cx="24" cy="23.5" r="3.4" fill="#000000" fill-opacity="0.45" />
  <circle cx="24" cy="23" r="3.1" fill="url(#hubRim)" />
  <circle cx="24" cy="23" r="2.75" fill="url(#hubCap)" />
</svg>
</svg>
