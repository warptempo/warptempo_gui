  <!-- DigitalMetronome and AppIcon: NOT from adwaita-icon-theme 3.22.0. The architect's own drawing (2026-10-17), a digital metronome drawn in the 48-unit frame at Adwaita 3.22's level of detail on the grammar of its pda: one dark outline on the pixel grid round a case 44 x 34 units with a vertical gradient lighter at the top, a white highlight line 1 unit inside fading top to bottom at .3, a dark line at .12 inside the foot and right edge, the pda's gloss sweep on the case and the display alike; the display a soft gradient in a 1-unit dark frame with a black line at .16 just inside and the recess's light line just outside; the speaker grill eight holes by two; the buttons flat discs with a dark ring, the yellow power button the smallest. The display shows the pendulum at the end of its swing, the Korg MA-1's one tick: a stick 10.5 units long leaning 45 degrees away from the note about a pivot on the window's foot, centred between the window's left edge and the note (the swing 45 degrees each way, its whole arc inside the window), cut 2 units above the foot, beside a quarter note with room right of its stem for the flag a metronome's eighth or sixteenth would carry, never drawn (architect 2026-10-17, the swing's second round; the MA-2's three-tick persistence and the pivot 6 units below the window were the morning's). Every tone is the earlier drawing's own. History: the metronome of 2026-10-16, drawn with Google's Gemini at his prompt after a Korg MA-1, cleaned on tablet mocks and re-laid on the MA-1's proportions in a nested 1024-unit viewport at 120 %, its WARP lettering, its 120 digits and its two sheens removed with this re-render ("too detailed; needs to be more like GNOME icons"). The drawing is licensed under the GNU LGPL v3, the set's licence (architect 2026-10-15). Warp, and the program icon. -->
