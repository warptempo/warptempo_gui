<?xml version="1.0" encoding="UTF-8"?>
<!-- THE ONE AUTHORED FILE IN THIS FOLDER (2026-08-08). Every other SVG here is
     a Breeze file copied verbatim; this one is drawn in Breeze's own
     office-chart-bar construction — the same L-shaped axis with its foot tick,
     the same 1-unit hollow bars standing on the baseline, the same nonzero
     winding for the bar interiors — with THREE ASCENDING bars instead of
     office-chart-bar's two unequal ones, because the glyph has to say
     ACCUMULATION (totals growing left to right) rather than "a bar chart".
     It is the Cumulative reading's toggle in the icon row (bare `u`).
     Breeze ships no ascending-bars chart icon: view-sort-ascending is six sort
     bars with an arrow under a matrix transform the in-tree renderer does not
     model, and office-chart-area's rising-area form needs the half-opacity
     second path this product cannot composite (and is a smudge at 22 px). -->
<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
    <style type="text/css" id="current-color-scheme">.ColorScheme-Text { color: #fcfcfc; } </style>
    <path d="M 4 3 L 4 9 L 4 10 L 4 15 L 4 16 L 4 17 L 3 17 L 3 18 L 4 18 L 4 19 L 5 19 L 5 18 L 19 18 L 19 17 L 19 5 L 16 5 L 16 17 L 14 17 L 14 9 L 11 9 L 11 17 L 9 17 L 9 13 L 6 13 L 6 17 L 5 17 L 5 16 L 5 15 L 5 10 L 5 9 L 5 3 L 4 3 z M 7 14 L 8 14 L 8 17 L 7 17 L 7 14 z M 12 10 L 13 10 L 13 17 L 12 17 L 12 10 z M 17 6 L 18 6 L 18 17 L 17 17 L 17 6 z " class="ColorScheme-Text" fill="currentColor"/>
</svg>
