<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <style>
    .bg { fill: #b8b8b8; }
    .glyph { fill: #005a54; }
    .record { fill: #e51d1d; }
    .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      fill: #111111;
      text-anchor: middle;
      font-weight: 400;
    }
  </style>

  <!-- Sheet Background -->
  <rect width="1000" height="480" class="bg" />

  <!-- ================= ROW 1 ================= -->

  <!-- Cell 1: go to start -->
  <g transform="translate(100, 110)">
    <!-- Bar -->
    <rect x="-19" y="-17" width="6" height="34" class="glyph" />
    <!-- Triangle (Left) -->
    <polygon points="19,-17 19,17 -3,0" class="glyph" />
  </g>
  <text x="100" y="210" class="label">go to start</text>

  <!-- Cell 2: left -->
  <g transform="translate(300, 110)">
    <!-- First Triangle (Left) -->
    <polygon points="-3,-17 -3,17 -25,0" class="glyph" />
    <!-- Second Triangle (Left) -->
    <polygon points="25,-17 25,17 3,0" class="glyph" />
  </g>
  <text x="300" y="210" class="label">left</text>

  <!-- Cell 3: play * -->
  <g transform="translate(500, 110)">
    <!-- Single Triangle (Right) -->
    <polygon points="-11,-17 -11,17 11,0" class="glyph" />
  </g>
  <text x="500" y="210" class="label">play *</text>

  <!-- Cell 4: pause * -->
  <g transform="translate(700, 110)">
    <!-- Left Bar -->
    <rect x="-10" y="-17" width="6" height="34" class="glyph" />
    <!-- Right Bar -->
    <rect x="4" y="-17" width="6" height="34" class="glyph" />
  </g>
  <text x="700" y="210" class="label">pause *</text>

  <!-- Cell 5: stop -->
  <g transform="translate(900, 110)">
    <!-- Square -->
    <rect x="-15" y="-15" width="30" height="30" class="glyph" />
  </g>
  <text x="900" y="210" class="label">stop</text>

  <!-- ================= ROW 2 ================= -->

  <!-- Cell 6: right -->
  <g transform="translate(100, 330)">
    <!-- First Triangle (Right) -->
    <polygon points="-25,-17 -25,17 -3,0" class="glyph" />
    <!-- Second Triangle (Right) -->
    <polygon points="3,-17 3,17 25,0" class="glyph" />
  </g>
  <text x="100" y="430" class="label">right</text>

  <!-- Cell 7: go to end -->
  <g transform="translate(300, 330)">
    <!-- Triangle (Right) -->
    <polygon points="-19,-17 -19,17 3,0" class="glyph" />
    <!-- Bar -->
    <rect x="13" y="-17" width="6" height="34" class="glyph" />
  </g>
  <text x="300" y="430" class="label">go to end</text>

  <!-- Cell 8: up * -->
  <g transform="translate(500, 330)">
    <!-- Single Triangle (Up, matched proportions) -->
    <polygon points="-17,11 17,11 0,-11" class="glyph" />
  </g>
  <text x="500" y="430" class="label">up *</text>

  <!-- Cell 9: down * -->
  <g transform="translate(700, 330)">
    <!-- Single Triangle (Down, matched proportions) -->
    <polygon points="-17,-11 17,-11 0,11" class="glyph" />
  </g>
  <text x="700" y="430" class="label">down *</text>

  <!-- Cell 10: render * -->
  <g transform="translate(900, 330)">
    <!-- Record Dot -->
    <circle cx="0" cy="0" r="17" class="record" />
  </g>
  <text x="900" y="430" class="label">render *</text>
</svg>
