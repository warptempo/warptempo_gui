<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="geometricPrecision">
  <defs>
    <!-- 90s teal linear gradient for the arrow -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4eebb8"/>
      <stop offset="45%" stop-color="#14c798"/>
      <stop offset="100%" stop-color="#058062"/>
    </linearGradient>

    <!-- Ring gradient -->
    <radialGradient id="ringGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#22d9a6"/>
      <stop offset="70%" stop-color="#0a8868"/>
      <stop offset="100%" stop-color="#044d3a"/>
    </radialGradient>

    <!-- Chrome bezel gradient -->
    <linearGradient id="metalBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d4d0c8"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
  </defs>

  <!-- Windows 98/ME Button / Canvas Background (optional preview) -->
  <rect width="48" height="48" fill="#d4d0c8"/>

  <!-- Lower Target Ring / Knob -->
  <g transform="translate(26, 32)">
    <!-- Outer rim shadow & ring -->
    <circle cx="0" cy="0" r="10.5" fill="#1b2e2b" />
    <circle cx="0" cy="0" r="9.5" fill="url(#metalBezel)" stroke="#22332e" stroke-width="1"/>
    <!-- Inner dial -->
    <circle cx="0" cy="0" r="7" fill="url(#ringGrad)" stroke="#114b3d" stroke-width="0.8"/>
    <!-- Center tick / notch -->
    <line x1="0" y1="-7" x2="0" y2="-2" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="-7" x2="0" y2="-2" stroke="#114b3d" stroke-width="0.6"/>
  </g>

  <!-- Curving Teal Arrow (Loops from top-right down toward the ring) -->
  <path d="M 28 30
           C 34 26, 36 17, 33 11
           C 29.5 4.5, 19.5 4, 15 9
           L 15 4
           L 5 13
           L 15 22
           L 15 16.5
           C 18.5 12, 26 12, 27.5 17
           C 29 21.5, 27 26.5, 23 29
           Z"
        fill="url(#tealGrad)"
        stroke="#10382f"
        stroke-width="1.4"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Inner top highlight sheen on arrow -->
  <path d="M 6.5 13 L 14 6.5 L 14 11 C 18.5 7 26.5 7 30 11.5"
        fill="none"
        stroke="#afffe4"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.8"/>
</svg>
